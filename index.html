<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineWave</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090e;color:white;font-family:Arial}header{position:sticky;top:0;background:#101018;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}.logo{font-size:24px;font-weight:900}.logo b{color:#ff3d68}input{max-width:48%;padding:11px;border-radius:25px;background:#22222d;color:white;border:1px solid #444}.hero{padding:65px 7%;background:linear-gradient(110deg,#17101b,#55223a,#101018)}.hero h1{font-size:clamp(40px,8vw,66px);margin:12px 0}.hero p{color:#ccc;line-height:1.6}.pink,button{background:#ff3d68;color:white;border:0;padding:12px 17px;border-radius:8px}main{padding:20px 5%}.filters{display:flex;gap:8px;overflow:auto}.filters button{border-radius:24px;background:#20202a}.filters .on{background:#ff3d68}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{height:220px;padding:14px;border-radius:12px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(145deg,#71324d,#151521);box-shadow:inset 0 -90px 65px -40px #000;cursor:pointer}.card small{color:#ffdce4}.card strong{font-size:19px;margin-top:5px}#detail{display:none;padding:25px 5%}#player{aspect-ratio:16/9;background:#181821;border-radius:12px;display:grid;place-items:center;margin-top:18px}#player video,#player iframe{width:100%;height:100%;border:0}footer{padding:25px;color:#999}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div class="logo">CINE<b>WAVE</b></div><input id="search" placeholder="Search movies..."></header><section class="hero"><small>YOUR PERSONAL MOVIE DESTINATION</small><h1>Stories that<br>stay with you.</h1><p>Discover films and series in one cinematic place.</p><button onclick="document.getElementById('catalog').scrollIntoView()">Explore titles →</button></section><main id="catalog"><h2>Browse categories</h2><div class="filters" id="filters"></div><h2>Trending titles</h2><div class="grid" id="grid"></div></main><section id="detail"><button onclick="back()">← Back</button><h1 id="title"></h1><p id="desc"></p><div id="player">Authorized video player will appear here.</div></section><footer>© CineWave · Stream only content you own or are licensed to distribute. <a style="color:#ff8ba2" href="admin.html">Admin demo</a></footer>
<script>
const seed=[{id:"m1",title:"Midnight Run",category:"Thriller",year:"2026",description:"A late-night mystery changes everything.",sourceType:"none"},{id:"m2",title:"Red Horizon",category:"Action",year:"2025",description:"A rescue mission beyond the edge.",sourceType:"none"},{id:"m3",title:"Blue Monsoon",category:"Drama",year:"2025",description:"Old friends return home.",sourceType:"none"},{id:"m4",title:"The Last Signal",category:"Sci-Fi",year:"2024",description:"A strange transmission arrives.",sourceType:"none"}];
let list=read(),cat="All";function read(){try{let x=JSON.parse(localStorage.getItem("cinewave_movies"));return Array.isArray(x)?x:seed}catch{return seed}}
function safe(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){list=read();let cats=["All",...new Set(list.map(x=>x.category))];filters.innerHTML=cats.map(c=>`<button class="${cat===c?'on':''}" onclick="cat='${safe(c)}';render()">${safe(c)}</button>`).join("");let q=search.value.toLowerCase();let a=list.filter(x=>(cat==="All"||x.category===cat)&&x.title.toLowerCase().includes(q));grid.innerHTML=a.map(x=>`<article class="card" onclick="openMovie('${safe(x.id)}')"><small>${safe(x.category)} · ${safe(x.year)}</small><strong>${safe(x.title)}</strong></article>`).join("")||"No titles found"}
function openMovie(id){let m=list.find(x=>x.id===id);if(!m)return;catalog.style.display="none";document.querySelector(".hero").style.display="none";detail.style.display="block";title.textContent=m.title;desc.textContent=m.description||"";player.innerHTML="";if(m.sourceType==="link"&&m.source){let u=m.source;let yt=u.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);if(yt)u="https://www.youtube-nocookie.com/embed/"+yt[1];if(u.includes("youtube-nocookie.com/embed"))player.innerHTML=`<iframe src="${u}" allowfullscreen></iframe>`;else player.innerHTML=`<video controls playsinline src="${u}"></video>`}else player.textContent="No public video is connected to this title yet."}
function back(){detail.style.display="none";catalog.style.display="block";document.querySelector(".hero").style.display="block";render()}search.oninput=render;render();
</script></body></html>
